name: Bug report
description: Report a reproducible problem in BitClone.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BitClone. Please avoid including credentials, API tokens, wallet seeds, or private keys.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
      placeholder: A concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Describe the result you expected.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the OS, Python version, network, storage mode, and relevant revision.
      placeholder: |
        OS: Ubuntu 24.04
        Python: 3.12
        Network: regtest
        Storage mode: archival
        Revision: abc1234
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or other evidence
      description: Redact secrets and personal information before pasting logs or screenshots.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I removed credentials, wallet secrets, and private data from this report.
          required: true
